name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".gitignore", "LICENSE"]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: k8s-arc-runners
    timeout-minutes: 10
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Verify module checksums
        run: go mod verify

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6

      - name: Run golangci-lint
        run: golangci-lint run ./...

  test:
    name: Test
    runs-on: k8s-arc-runners
    timeout-minutes: 10
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Run tests with coverage
        run: |
          go test -v -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tee coverage-summary.txt

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          THRESHOLD=45
          if [ "$(echo "$COVERAGE < $THRESHOLD" | bc -l)" -eq 1 ]; then
            echo "FAIL: Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        continue-on-error: true
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage-summary.txt
          if-no-files-found: ignore
          retention-days: 3

  security:
    name: Security
    runs-on: k8s-arc-runners
    timeout-minutes: 25
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.26.1
          gosec -exclude=G104,G112,G115,G117,G118,G706 -fmt=json -out=gosec-results.json ./...

      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        continue-on-error: true
        with:
          name: gosec-results
          path: gosec-results.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
